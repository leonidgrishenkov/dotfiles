---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  BREWFILE: "{{.ROOT_DIR}}/homebrew/.Brewfile"

tasks:
  stow:essentials:
    desc: Run stow with essential entities
    cmds:
      - cmd: stow stow
      - cmd: cat ./stow/darwin-essential | xargs -I {} stow {}
        platforms:
          - darwin
      - cmd: cat ./stow/linux-essential | xargs -I {} stow {}
        platforms:
          - linux

  pi:install:
    desc: Install Pi extensions
    cmds:
      - pi install git:github.com/leonidgrishenkov/pi-extensions
      - pi install git:github.com/leonidgrishenkov/agent-skills
  pi:update:
    desc: Update Pi extensions
    cmds:
      - pi update git:github.com/leonidgrishenkov/pi-extensions
      - pi update git:github.com/leonidgrishenkov/agent-skills

  nvim:install:
    desc: Install locked lazyvim plugins
    cmd: nvim --headless "+Lazy! restore" +qa

  brew:dump:
    desc: Overwrite the Brewfile with this machine's Homebrew state
    platforms:
      - darwin
    preconditions:
      - sh: command -v brew >/dev/null
        msg: homebrew is not installed
    cmd: brew bundle dump --force --file {{.BREWFILE}}

  brew:install:
    desc: Install everything listed in the Brewfile
    platforms:
      - darwin
    preconditions:
      - sh: command -v brew >/dev/null
        msg: homebrew is not installed
      - sh: test -f {{.BREWFILE}}
        msg: "no Brewfile at {{.BREWFILE}}"
    cmd: brew bundle install --file {{.BREWFILE}}

  brew:check:
    desc: Check wether everything listed in the Brewfile is installed or not
    platforms:
      - darwin
    preconditions:
      - sh: command -v brew >/dev/null
        msg: homebrew is not installed
      - sh: test -f {{.BREWFILE}}
        msg: "no Brewfile at {{.BREWFILE}}"
    cmd: brew bundle check --file {{.BREWFILE}} --verbose

  brew:uninstall:
    desc: Uninstall packages that are NOT listed in the Brewfile (destructive)
    platforms:
      - darwin
    preconditions:
      - sh: test -f {{.BREWFILE}}
        msg: "no Brewfile at {{.BREWFILE}}"
    cmds:
      - cmd: |
          brew bundle cleanup --file {{.BREWFILE}}
          printf '\nUninstall everything listed above? [y/N] '
          read -r reply
          case "$reply" in
            [yY]*) brew bundle cleanup --file {{.BREWFILE}} --force ;;
            *) echo "Aborted, nothing removed." ;;
          esac

  brew:trust:
    desc: Trust the third-party taps declared in the Brewfile (run once per machine)
    platforms:
      - darwin
    preconditions:
      - sh: test -f {{.BREWFILE}}
        msg: "no Brewfile at {{.BREWFILE}}"
    cmds:
      - cmd: |
          taps=$(grep '^tap "' {{.BREWFILE}} | sed 's/^tap "//;s/".*//')
          echo "Homebrew will be allowed to load code from these taps:"
          echo "$taps" | sed 's/^/  /'
          printf '\nTrust all of them? [y/N] '
          read -r reply
          case "$reply" in
            [yY]*) echo "$taps" | xargs -I {} brew trust --tap {} ;;
            *) echo "Aborted, nothing trusted." ;;
          esac
